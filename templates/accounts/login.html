{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Login - Hold On{% endblock %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 85vh;">
  <div class="col-12 col-sm-8 col-md-6 col-lg-4">
    <div class="card-custom p-4 p-sm-5 text-center shadow-lg">
      <div class="d-flex align-items-center justify-content-center gap-2 mb-4">
        <div class="brand-icon">
          <i class="bi bi-camera-reels-fill"></i>
        </div>
        <h2 class="fw-bold m-0">Hold On</h2>
      </div>

      <form method="POST" class="text-start">
        {% csrf_token %}
        {{ form|crispy }}
        
        <button type="submit" class="btn btn-brand w-100 mt-3 py-2">Log In</button>
      </form>

      <div class="mt-4 pt-3 border-top border-secondary text-muted" style="font-size: 0.9rem;">
        Don't have an account? <a href="{% url 'accounts:signup' %}" class="fw-bold text-primary">Sign up</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
