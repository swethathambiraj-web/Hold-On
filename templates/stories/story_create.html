{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Add to Story • Hold On{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 550px;">
  <div class="card-custom p-4 p-md-5">
    <div class="d-flex align-items-center justify-content-between mb-4 pb-3 border-bottom border-secondary">
      <h4 class="fw-bold mb-0"><i class="bi bi-camera text-danger me-2"></i> Add to Your Story</h4>
      <a href="{% url 'feed:home' %}" class="btn-close btn-close-white"></a>
    </div>

    <div class="alert alert-info py-2" style="font-size: 0.85rem;">
      <i class="bi bi-clock-history me-1"></i> Stories automatically disappear after 24 hours.
    </div>

    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form|crispy }}

      <div class="d-grid mt-4">
        <button type="submit" class="btn btn-brand py-2">Publish Story</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
