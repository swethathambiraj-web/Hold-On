{% load static %}
<!-- Mobile Top Header -->
<header class="mobile-header">
  <a href="{% url 'feed:home' %}" class="d-flex align-items-center gap-2 text-decoration-none">
    <div class="brand-icon" style="width: 28px; height: 28px; font-size: 1rem;">
      <i class="bi bi-camera-reels-fill"></i>
    </div>
    <span class="fw-bold fs-5 text-light">Hold On</span>
  </a>

  <div class="d-flex align-items-center gap-3">
    <a href="{% url 'notifications:list' %}" class="position-relative text-light fs-5">
      <i class="bi bi-heart"></i>
      {% if unread_notifications_count > 0 %}
        <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle" style="width: 8px; height: 8px;"></span>
      {% endif %}
    </a>
    <a href="{% url 'messaging:inbox' %}" class="position-relative text-light fs-5">
      <i class="bi bi-chat-dots"></i>
      {% if unread_messages_count > 0 %}
        <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle" style="width: 8px; height: 8px;"></span>
      {% endif %}
    </a>
  </div>
</header>

<!-- Mobile Bottom Bar -->
<nav class="mobile-bottom-nav">
  <a href="{% url 'feed:home' %}" class="mobile-nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}">
    <i class="bi bi-house-door-fill"></i>
  </a>
  <a href="{% url 'feed:explore' %}" class="mobile-nav-link {% if request.resolver_match.url_name == 'explore' %}active{% endif %}">
    <i class="bi bi-compass-fill"></i>
  </a>
  <a href="{% url 'posts:post_create' %}" class="mobile-nav-link">
    <i class="bi bi-plus-square-fill"></i>
  </a>
  <a href="{% url 'stories:create' %}" class="mobile-nav-link">
    <i class="bi bi-camera-fill"></i>
  </a>
  <a href="{% url 'accounts:profile' username=request.user.username %}" class="mobile-nav-link">
    <img src="{{ request.user.avatar_url }}" class="rounded-circle" style="width: 24px; height: 24px; object-fit: cover;" alt="avatar">
  </a>
</nav>
